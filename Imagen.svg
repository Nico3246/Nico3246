<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11151b"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f4f7"/>
      <stop offset="100%" stop-color="#aeb6c2"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#657080" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1800" height="600" fill="url(#bg)"/>

  <circle cx="-40" cy="610" r="330" fill="none" stroke="#7a8491" stroke-width="2" opacity="0.18"/>
  <circle cx="1690" cy="70" r="410" fill="none" stroke="#7a8491" stroke-width="2" opacity="0.16"/>
  <circle cx="1660" cy="70" r="300" fill="none" stroke="#7a8491" stroke-width="1" opacity="0.08"/>

  <line x1="70" y1="110" x2="1730" y2="510" stroke="#8f99a6" stroke-width="1.5" opacity="0.12"/>
  <line x1="120" y1="525" x2="1710" y2="130" stroke="#8f99a6" stroke-width="1.2" opacity="0.08"/>
  <line x1="120" y1="330" x2="1190" y2="330" stroke="#9ca6b3" stroke-width="1" opacity="0.12"/>

  <rect x="90" y="70" width="170" height="90" fill="url(#dots)" opacity="0.45"/>
  <rect x="1510" y="430" width="190" height="100" fill="url(#dots)" opacity="0.35"/>

  <ellipse cx="520" cy="300" rx="430" ry="200" fill="#6b7480" opacity="0.03" filter="url(#soft)"/>

  <text x="120" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="150" font-weight="700" fill="url(#title)" letter-spacing="-4">Nicolás</text>
  <text x="128" y="350" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" fill="#c5cbd3">Computer Engineering Student</text>
  <text x="128" y="410" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="300" fill="#9ba4b0" letter-spacing="1.5">Python · Java · C++</text>
</svg>